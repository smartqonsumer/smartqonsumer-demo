# Adds an assignee to every Issue of the organization Project smartqonsumer #1
# according to its Status:
#
#   Status "In review"   → REVIEW_ASSIGNEE
#   Status "In progress" → PROGRESS_ASSIGNEE
#
# A Status change in a Projects V2 board emits no event a repository workflow
# can listen to, so the board is polled every 5 minutes (GitHub may delay or
# skip scheduled runs under load; schedules only run from the default branch).
#
# Configuration (Settings → Secrets and variables → Actions):
#   - secret   PROJECT_TOKEN     : PAT that can read the org Project, read the
#                                  Issues and write their assignees
#                                  (SMARTQONSUMER_TOKEN is used as a fallback)
#   - variable REVIEW_ASSIGNEE   : login added on "In review"   (without "@")
#   - variable PROGRESS_ASSIGNEE : login added on "In progress" (without "@")
# A status whose variable is empty is ignored; at least one must be set.
#
# Idempotent: existing assignees are kept, and nothing is sent when the
# person is already assigned.
name: Assign issues by project status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# GITHUB_TOKEN is not used: every API call goes through PROJECT_TOKEN.
permissions: {}

concurrency:
  group: assign-by-status
  cancel-in-progress: false

env:
  PROJECT_OWNER: smartqonsumer
  PROJECT_NUMBER: 1

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.SMARTQONSUMER_TOKEN }}
          REVIEW_ASSIGNEE: ${{ vars.REVIEW_ASSIGNEE }}
          PROGRESS_ASSIGNEE: ${{ vars.PROGRESS_ASSIGNEE }}
        run: |
          missing=0
          if [ -z "${PROJECT_TOKEN}" ]; then
            echo "::error title=Missing secret::Neither PROJECT_TOKEN nor SMARTQONSUMER_TOKEN is set (Settings → Secrets and variables → Actions → Secrets)."
            missing=1
          fi
          if [ -z "${REVIEW_ASSIGNEE}" ] && [ -z "${PROGRESS_ASSIGNEE}" ]; then
            echo "::error title=Missing variable::Set REVIEW_ASSIGNEE and/or PROGRESS_ASSIGNEE (Settings → Secrets and variables → Actions → Variables)."
            missing=1
          fi
          [ -z "${REVIEW_ASSIGNEE}" ] && echo "::warning::REVIEW_ASSIGNEE is not set - \"In review\" issues are ignored."
          [ -z "${PROGRESS_ASSIGNEE}" ] && echo "::warning::PROGRESS_ASSIGNEE is not set - \"In progress\" issues are ignored."
          exit "${missing}"

      - name: Assign issues by status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.SMARTQONSUMER_TOKEN }}
          REVIEW_ASSIGNEE: ${{ vars.REVIEW_ASSIGNEE }}
          PROGRESS_ASSIGNEE: ${{ vars.PROGRESS_ASSIGNEE }}
        run: |
          set -uo pipefail

          # Tolerate a leading "@" or stray spaces in the variables.
          clean() { local v; v="$(printf '%s' "$1" | tr -d '[:space:]')"; printf '%s' "${v#@}"; }
          review_assignee="$(clean "${REVIEW_ASSIGNEE}")"
          progress_assignee="$(clean "${PROGRESS_ASSIGNEE}")"

          # Status → login to add (empty: status ignored).
          assignee_for() {
            case "$1" in
              "In review") printf '%s' "${review_assignee}" ;;
              "In progress") printf '%s' "${progress_assignee}" ;;
            esac
          }

          query='
            query($owner: String!, $number: Int!, $cursor: String) {
              organization(login: $owner) {
                projectV2(number: $number) {
                  title
                  items(first: 100, after: $cursor) {
                    pageInfo { hasNextPage endCursor }
                    nodes {
                      type
                      status: fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                      content {
                        __typename
                        ... on Issue {
                          number
                          repository { nameWithOwner }
                          assignees(first: 100) { nodes { login } }
                        }
                      }
                    }
                  }
                }
              }
            }'

          inspected=0
          in_review=0
          in_progress=0
          assigned=0
          already=0
          errors=0
          cursor=""
          page=0

          while :; do
            page=$((page + 1))
            args=(-f query="${query}" -f owner="${PROJECT_OWNER}" -F number="${PROJECT_NUMBER}")
            [ -n "${cursor}" ] && args+=(-f cursor="${cursor}")

            if ! response="$(gh api graphql "${args[@]}" 2>&1)"; then
              echo "::error title=Project query failed::Page ${page}: ${response}"
              exit 1
            fi
            if [ "$(jq -r '.data.organization.projectV2 // empty | .title' <<<"${response}")" = "" ]; then
              echo "::error title=Project not found::${PROJECT_OWNER} #${PROJECT_NUMBER} is not readable with the token. Response: ${response}"
              exit 1
            fi

            # One compact line per real Issue: repo, number, status, assignees.
            # Draft issues, pull requests and items without repository or
            # number are filtered out here.
            items="$(jq -c '
              .data.organization.projectV2.items.nodes[]
              | select(.type == "ISSUE" and .content.__typename == "Issue")
              | select(.content.repository.nameWithOwner != null and .content.number != null)
              | {
                  repo: .content.repository.nameWithOwner,
                  number: .content.number,
                  status: (.status.name // ""),
                  assignees: [.content.assignees.nodes[].login]
                }' <<<"${response}")"

            while IFS= read -r item; do
              [ -z "${item}" ] && continue
              inspected=$((inspected + 1))

              repo="$(jq -r '.repo' <<<"${item}")"
              number="$(jq -r '.number' <<<"${item}")"
              status="$(jq -r '.status' <<<"${item}")"

              case "${status}" in
                "In review") in_review=$((in_review + 1)) ;;
                "In progress") in_progress=$((in_progress + 1)) ;;
              esac
              user="$(assignee_for "${status}")"
              [ -z "${user}" ] && continue

              current="$(jq -r '.assignees | if length == 0 then "(none)" else join(", ") end' <<<"${item}")"
              echo "Checking ${repo}#${number}"
              echo "Status: ${status}"
              echo "Current assignees: ${current}"

              # Logins are case-insensitive on GitHub.
              if jq -e --arg u "${user}" 'any(.assignees[]; ascii_downcase == ($u | ascii_downcase))' <<<"${item}" >/dev/null; then
                echo "${user} already assigned - skipping"
                already=$((already + 1))
                echo
                continue
              fi

              echo "Adding assignee: ${user}"
              # This endpoint adds to the existing assignees (it never replaces them).
              # stdout (JSON) and stderr are kept apart so a warning never breaks the JSON check below.
              if ! result="$(gh api --method POST "repos/${repo}/issues/${number}/assignees" -f "assignees[]=${user}" 2>"${RUNNER_TEMP:-/tmp}/assign-error.log")"; then
                echo "::error title=Assignment failed::${repo}#${number}: $(cat "${RUNNER_TEMP:-/tmp}/assign-error.log") ${result}"
                errors=$((errors + 1))
                echo
                continue
              fi

              # GitHub answers 201 but silently drops a login that cannot be
              # assigned (not a collaborator of the repo, typo...): check it.
              if jq -e --arg u "${user}" 'any(.assignees[].login; ascii_downcase == ($u | ascii_downcase))' <<<"${result}" >/dev/null 2>&1; then
                echo "${user} assigned to ${repo}#${number}"
                assigned=$((assigned + 1))
              else
                echo "::error title=User not assignable::${user} was not added to ${repo}#${number}. The user must have access to ${repo} (collaborator or org member)."
                errors=$((errors + 1))
              fi
              echo
            done <<<"${items}"

            if [ "$(jq -r '.data.organization.projectV2.items.pageInfo.hasNextPage' <<<"${response}")" != "true" ]; then
              break
            fi
            cursor="$(jq -r '.data.organization.projectV2.items.pageInfo.endCursor' <<<"${response}")"
          done

          summary="Project checked: ${PROJECT_OWNER} #${PROJECT_NUMBER}
          Issues inspected: ${inspected}
          Issues in review: ${in_review} (→ ${review_assignee:-ignored})
          Issues in progress: ${in_progress} (→ ${progress_assignee:-ignored})
          Users assigned: ${assigned}
          Already assigned: ${already}
          Errors: ${errors}"
          summary="$(sed 's/^ *//' <<<"${summary}")"

          echo "----------------------------------------"
          echo "${summary}"
          {
            echo '### Assign issues by project status'
            echo '```text'
            echo "${summary}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"

          # Errors were logged per issue; fail the run so they get noticed.
          [ "${errors}" -eq 0 ]
