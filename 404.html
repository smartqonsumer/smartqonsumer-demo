<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | SmartQonsumer</title>
  <meta name="description" content="La page demandée est introuvable. Retrouvez la présentation de SmartQonsumer depuis la page d'accueil.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/q-mark.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="/design-tokens.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--color-brand-50);font-family:var(--font-sans);color:var(--color-text-primary)}
    main{width:min(620px,100%);padding:48px;border:1px solid var(--color-border);border-radius:var(--radius-xl);background:#fff;box-shadow:var(--shadow-lg);text-align:center}
    img{width:auto;height:36px;margin-bottom:32px}
    .code{color:var(--color-brand-700);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:10px 0 12px;font-size:clamp(32px,7vw,52px);line-height:1.05}
    p{margin:0 auto 28px;max-width:460px;color:var(--color-text-muted);font-size:16px;line-height:1.6}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:var(--radius-sm);background:var(--color-action-primary);color:#fff;font-weight:700;text-decoration:none}
    a:hover{background:var(--color-action-primary-hover)}
    a:focus-visible{outline:none;box-shadow:var(--focus-ring)}
    @media(max-width:560px){main{padding:36px 24px}}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-smartqonsumer.png" alt="SmartQonsumer" width="1917" height="257">
    <div class="code">Erreur 404</div>
    <h1>Cette page n'existe pas.</h1>
    <p>L'adresse est peut-être incorrecte ou la page a été déplacée. Revenez à la présentation de SmartQonsumer.</p>
    <a href="/">Retour à l'accueil</a>
  </main>
</body>
</html>
